name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run local tests
        run: |
          for test_script in tests/*.sh scripts/*.sh; do
            if [ -f "$test_script" ]; then
              bash "$test_script"
            fi
          done
